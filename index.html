<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050814">
<title>应用下载中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #0d1638 0%, #050814 55%, #03040c 100%);
    color: #e8f6ff; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

  header { text-align: center; margin-bottom: 40px; }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px;
    background: linear-gradient(135deg, #0b1a3a, #050814);
    border: 1px solid rgba(93,240,255,.35); box-shadow: 0 0 40px rgba(0,229,255,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 40px; height: 40px; }
  h1 {
    font-size: 26px; font-weight: 800; letter-spacing: 2px;
    color: #5df0ff; text-shadow: 0 0 16px rgba(93,240,255,.7), 0 0 50px rgba(93,240,255,.3);
  }
  .sub { margin-top: 10px; font-size: 14px; color: rgba(232,246,255,.55); }

  .stats { display: flex; justify-content: center; gap: 26px; margin-top: 18px; font-size: 12px; color: rgba(232,246,255,.4); }
  .stats b { color: #b39dff; font-size: 15px; margin-right: 4px; }

  .file-card {
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,.14); border-radius: 22px;
    padding: 24px; margin-bottom: 20px;
    box-shadow: 0 10px 36px rgba(0,0,0,.35);
    display: flex; gap: 18px; align-items: flex-start;
    transition: transform .2s, border-color .2s;
  }
  .file-card:hover { transform: translateY(-3px); border-color: rgba(0,229,255,.4); }
  .icon {
    flex: none; width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: #06121f;
    background: linear-gradient(135deg, #00e5ff, #7b5cff);
    box-shadow: 0 0 26px rgba(0,229,255,.35);
  }
  .icon.exe { background: linear-gradient(135deg, #7b5cff, #ff5c8a); box-shadow: 0 0 26px rgba(123,92,255,.35); }
  .icon.web { background: linear-gradient(135deg, #5df0ff, #7fe6a4); box-shadow: 0 0 26px rgba(127,230,164,.35); }
  .info { flex: 1; min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fname { font-size: 19px; font-weight: 700; }
  .ver {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(0,229,255,.14); border: 1px solid rgba(0,229,255,.45); color: #5df0ff;
  }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(140,110,255,.13); border: 1px solid rgba(140,110,255,.4); color: #b39dff; }
  .meta { margin-top: 7px; font-size: 12px; color: rgba(232,246,255,.45); }
  .desc { margin-top: 10px; font-size: 13.5px; line-height: 1.75; color: rgba(232,246,255,.75); }
  .install-tip { margin-top: 8px; font-size: 12px; color: rgba(255,215,106,.75); }
  .dl-row { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 26px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #06121f;
    background: linear-gradient(90deg, #00e5ff, #7b5cff);
    box-shadow: 0 0 26px rgba(0,229,255,.4); cursor: pointer; transition: transform .15s, box-shadow .2s;
  }
  .dl-btn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(0,229,255,.6); }
  .dl-btn:active { transform: scale(.97); }
  .mirror { font-size: 12px; color: rgba(232,246,255,.4); }
  .mirror a { color: rgba(93,240,255,.7); border-bottom: 1px dashed rgba(93,240,255,.4); }

  footer { margin-top: 50px; text-align: center; font-size: 12px; color: rgba(232,246,255,.3); line-height: 2; }
  footer a { color: rgba(93,240,255,.55); }

  .empty { text-align: center; padding: 70px 0; color: rgba(232,246,255,.4); font-size: 14px; }
  .loading { text-align: center; padding: 70px 0; color: rgba(232,246,255,.4); font-size: 14px; }

  /* ===== 选择系统弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(3,4,12,.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    align-items: center; justify-content: center; padding: 24px;
  }
  .modal-mask.show { display: flex; animation: fadeIn .22s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 420px;
    background: rgba(20,28,58,.55);
    -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
    border: 1px solid rgba(255,255,255,.16); border-radius: 26px;
    padding: 28px 24px 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    animation: popIn .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { transform: scale(.85) translateY(14px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .modal h3 { text-align: center; font-size: 18px; font-weight: 800; color: #e8f6ff; text-shadow: 0 0 14px rgba(93,240,255,.5); }
  .modal .m-sub { text-align: center; margin-top: 6px; font-size: 12.5px; color: rgba(232,246,255,.5); }
  .os-opt {
    display: flex; align-items: center; gap: 14px; margin-top: 16px;
    padding: 16px 18px; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    transition: transform .15s, border-color .2s, background .2s;
    -webkit-user-select: none; user-select: none;
  }
  .os-opt:hover { border-color: rgba(0,229,255,.45); background: rgba(0,229,255,.07); }
  .os-opt:active { transform: scale(.97); }
  .os-opt .os-ico {
    flex: none; width: 46px; height: 46px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #06121f;
  }
  .os-opt.android .os-ico { background: linear-gradient(135deg, #00e5ff, #4d8bff); box-shadow: 0 0 18px rgba(0,229,255,.4); }
  .os-opt.ios .os-ico { background: linear-gradient(135deg, #5df0ff, #7fe6a4); box-shadow: 0 0 18px rgba(127,230,164,.35); }
  .os-opt .os-txt b { display: block; font-size: 15px; color: #e8f6ff; }
  .os-opt .os-txt span { display: block; margin-top: 3px; font-size: 12px; color: rgba(232,246,255,.5); line-height: 1.5; }
  .os-opt.recommend { border-color: rgba(0,229,255,.6); background: rgba(0,229,255,.09); }
  .os-opt.recommend::after { content: '推荐'; margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(0,229,255,.16); border: 1px solid rgba(0,229,255,.5); color: #5df0ff; flex: none; }
  .modal-cancel {
    margin-top: 18px; width: 100%; padding: 12px; border-radius: 14px;
    text-align: center; font-size: 14px; font-weight: 600; cursor: pointer;
    color: rgba(232,246,255,.65); background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); transition: background .2s;
    -webkit-user-select: none; user-select: none;
  }
  .modal-cancel:hover { background: rgba(255,255,255,.1); }
  @media (max-width: 560px) {
    .wrap { padding-top: 34px; }
    .file-card { padding: 20px 18px; cursor: pointer; }
    .icon { width: 54px; height: 54px; font-size: 20px; }
    .fname { font-size: 17px; }
    .modal { padding: 24px 18px 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="17" stroke="url(#g)" stroke-width="3.5"/>
          <path d="M24 14v10l7 5" stroke="#5df0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient></defs>
        </svg>
      </div>
      <h1 id="siteName">应用下载中心</h1>
      <div class="sub" id="siteDesc"></div>
      <div class="stats"><span><b id="statCount">0</b>个应用</span><span><b id="statVer">—</b>最新版本</span></div>
    </header>

    <main id="list"><div class="loading">加载中…</div></main>

    <footer>
      所有文件均由本站作者本人上传 · 下载即表示你信任该文件<br>
      Powered by <a href="https://github.com/2000423/download-center" target="_blank">GitHub Pages</a>
    </footer>
  </div>

  <!-- 选择系统弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modalName">选择你的手机系统</h3>
      <div class="m-sub" id="modalSub">同一个应用，两种获取方式，功能完全一致</div>
      <div class="os-opt android" id="optAndroid">
        <div class="os-ico">安卓</div>
        <div class="os-txt">
          <b>Android 手机</b>
          <span>下载 APK 安装包 → 点开安装，桌面出现独立 App 图标</span>
        </div>
      </div>
      <div class="os-opt ios" id="optIos">
        <div class="os-ico">iPhone</div>
        <div class="os-txt">
          <b>iPhone / iPad</b>
          <span>打开网页版 → Safari「分享 → 添加到主屏幕」即可当 App 用</span>
        </div>
      </div>
      <div class="modal-cancel" id="modalCancel">取消</div>
    </div>
  </div>

<script>
const APP_URLS = { web: '', apk: '' };

function openModal(f) {
  document.getElementById('modalName').textContent = f.name + ' · 选择系统';
  APP_URLS.web = f.file;
  APP_URLS.apk = f.apkMirror || '';
  // 根据当前设备自动高亮推荐项
  const ua = navigator.userAgent;
  const isIos = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  document.getElementById('optIos').classList.toggle('recommend', isIos);
  document.getElementById('optAndroid').classList.toggle('recommend', isAndroid);
  document.getElementById('modalMask').classList.add('show');
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('optAndroid').addEventListener('click', () => {
  if (APP_URLS.apk) { const a = document.createElement('a'); a.href = APP_URLS.apk; a.download = ''; a.click(); }
  closeModal();
});
document.getElementById('optIos').addEventListener('click', () => {
  if (APP_URLS.web) window.open(APP_URLS.web, '_blank');
  closeModal();
});

fetch('files.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('siteName').textContent = data.siteName || '应用下载中心';
    document.getElementById('siteDesc').textContent = data.siteDesc || '';
    const list = document.getElementById('list');
    const files = data.files || [];
    document.getElementById('statCount').textContent = files.length;
    document.getElementById('statVer').textContent = files.length ? files[0].version : '—';
    if (!files.length) { list.innerHTML = '<div class="empty">暂无文件，敬请期待</div>'; return; }
    list.innerHTML = files.map(f => {
      const tags = (f.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      return `
      <div class="file-card" data-id="${f.id}" style="cursor:pointer">
        <div class="icon">APP</div>
        <div class="info">
          <div class="name-row">
            <span class="fname">${f.name}</span>
            <span class="ver">v${f.version}</span>
            ${tags}
          </div>
          <div class="meta">${f.date} · ${f.size} · Android &amp; iPhone</div>
          <div class="desc">${f.desc || ''}</div>
          <div class="dl-row">
            <a class="dl-btn" href="javascript:void(0)">📲 获取应用</a>
          </div>
        </div>
      </div>`;
    }).join('');
    // 点击卡片或按钮 → 弹出系统选择窗
    document.querySelectorAll('.file-card').forEach(card => {
      card.addEventListener('click', () => {
        const f = files.find(x => x.id === card.dataset.id);
        if (f) openModal(f);
      });
    });
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  });
</script>
</body>
</html>
