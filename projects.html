<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<title>项目页 · 应用下载中心</title>
<style>
  /* ===== 与首页统一的柔和轻质感 Soft UI ===== */
  :root {
    --ink: #3d414c; --ink-soft: #777d8a; --ink-faint: #a2a7b2;
    --card: rgba(255,255,255,.82); --line: rgba(255,255,255,.95);
    --mint: #86d4cf; --mint-deep: #4e9d99; --peach: #f3b88f; --peach-deep: #c47f55;
    --shadow: 0 18px 44px rgba(96,88,112,.10), 0 3px 10px rgba(96,88,112,.05), inset 0 1px 0 rgba(255,255,255,.9);
    --shadow-sm: 0 8px 22px rgba(96,88,112,.09), inset 0 1px 0 rgba(255,255,255,.9);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; color: var(--ink); min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background: linear-gradient(135deg, #faf7f1 0%, #f5f3f9 52%, #fdf5f0 100%);
  }
  body::before, body::after { content: ''; position: fixed; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(90px); opacity: .55; }
  body::before { width: 520px; height: 520px; top: -190px; left: -130px; background: #ffe7b7; box-shadow: 1000px 620px 0 60px #ffd9e2; }
  body::after { width: 600px; height: 600px; bottom: -260px; right: -180px; background: #d3e8f7; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 30px 24px 70px; position: relative; }

  .proj-btn {
    position: absolute; top: 34px; right: 24px; z-index: 50;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--peach-deep); background: rgba(243,184,143,.16);
    border: 1px solid rgba(243,184,143,.38); box-shadow: var(--shadow-sm);
    transition: transform .15s, background .2s;
  }
  .proj-btn:hover { background: rgba(243,184,143,.28); transform: translateY(-1px); }
  .proj-btn:active { transform: scale(.96); }
  @media (max-width: 560px) { .proj-btn { top: 20px; right: 16px; padding: 7px 13px; font-size: 12px; } }

  header { text-align: center; margin: 16px 0 30px; }
  header h1 { font-size: 28px; font-weight: 750; letter-spacing: .5px; color: #363b46; }
  header .sub { margin-top: 8px; font-size: 14px; color: var(--ink-soft); }

  .proj-card {
    display: block; text-decoration: none; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 26px;
    padding: 26px; margin-bottom: 20px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    transition: transform .18s, box-shadow .2s;
  }
  .proj-card:hover { transform: translateY(-3px); box-shadow: 0 26px 54px rgba(96,88,112,.15), 0 5px 14px rgba(96,88,112,.06), inset 0 1px 0 rgba(255,255,255,.9); }
  .name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .icon {
    width: 54px; height: 54px; border-radius: 17px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    background: linear-gradient(135deg, #c9efe9, #f8d9bd);
    box-shadow: 0 8px 20px rgba(110,180,175,.2), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .fname { font-size: 20px; font-weight: 700; color: #383d48; }
  .ver { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: rgba(134,212,207,.15); color: var(--mint-deep); }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: rgba(198,184,232,.15); color: #7e72a3; }

  .sec-title { margin-top: 17px; font-size: 13px; font-weight: 700; letter-spacing: .05em; color: #4a4f5a; display: flex; align-items: center; gap: 8px; }
  .sec-title::before { content: ""; width: 4px; height: 14px; border-radius: 99px; background: linear-gradient(180deg, #a5e2dc, #f3b88f); }
  .intro { margin-top: 8px; font-size: 13.5px; line-height: 1.85; color: var(--ink-soft); }
  .feat { margin-top: 8px; }
  .feat li { list-style: none; font-size: 13px; line-height: 1.9; color: var(--ink-soft); display: flex; gap: 8px; }
  .feat li::before { content: "✓"; color: var(--mint-deep); font-weight: 700; flex: none; }
  .lim { margin-top: 8px; }
  .lim li { list-style: none; font-size: 12.5px; line-height: 1.9; color: var(--ink-faint); display: flex; gap: 8px; }
  .lim li::before { content: "✕"; color: var(--peach-deep); font-weight: 700; flex: none; }

  .loading, .empty { text-align: center; padding: 60px 0; font-size: 14px; color: var(--ink-faint); }
  footer { text-align: center; margin-top: 44px; font-size: 12px; color: var(--ink-faint); }
  footer a { color: var(--mint-deep); }
  @media (max-width: 560px) {
    .wrap { padding: 18px 16px 56px; }
    header { margin-top: 8px; }
    .proj-card { padding: 20px 18px; border-radius: 22px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="proj-btn" href="index.html">← 下载中心</a>
    <header>
      <h1>项目页</h1>
      <div class="sub">每个软件是什么、能做什么、做不到什么，一篇看明白</div>
    </header>
    <main id="list"><div class="loading">加载中…</div></main>
    <footer>Powered by GitHub Pages · <a href="index.html">返回下载中心</a></footer>
  </div>

<script>
fetch('files.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('list');
    const files = data.files || [];
    if (!files.length) { list.innerHTML = '<div class="empty">暂无应用</div>'; return; }
    list.innerHTML = files.map(f => {
      const tags = (f.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      const feats = (f.features || []).map(x => `<li>${x}</li>`).join('');
      const lims = (f.limits || []).map(x => `<li>${x}</li>`).join('');
      return `
      <a class="proj-card" href="${f.file}" target="_blank" rel="noopener">
        <div class="name-row">
          <span class="icon">${f.icon || 'APP'}</span>
          <span class="fname">${f.name}</span>
          <span class="ver">v${f.version}</span>
          ${tags}
        </div>
        <div class="sec-title">介绍</div>
        <div class="intro">${f.desc || ''}</div>
        <div class="sec-title">它可以做什么</div>
        <ul class="feat">${feats}</ul>
        <div class="sec-title">它暂时做不到什么</div>
        <ul class="lim">${lims}</ul>
      </a>`;
    }).join('');
  })
  .catch(() => { document.getElementById('list').innerHTML = '<div class="empty">加载失败，请刷新重试</div>'; });
</script>
</body>
</html>
